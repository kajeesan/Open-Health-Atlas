name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private vulnerability reporting](https://github.com/kajeesan/Open-Health-Atlas/security/advisories/new).
        Public reports must not contain health records, database files, credentials, tokens, private paths, or live deployment details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give a minimal example using fictional data. Redact any error text or screenshots before sharing.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Release tag or commit, operating system, Python version, and browser or MCP client if relevant. No private paths or hosts.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used fictional data and removed health records, credentials, tokens, private paths, and deployment details.
          required: true
